# Builds de revue et de diffusion, sans envoi vers Google Play.
name: APK Android

on:
  pull_request:
  workflow_dispatch:
    inputs:
      profil:
        description: "Play (APK de test + AAB) ou sideload (APK autonome)"
        type: choice
        options: [play, sideload]
        default: play
      publier:
        description: "Publier un APK sideload signé sur la branche apk"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      PROFILE: ${{ inputs.profil || 'play' }}
      VITE_API_BASE: ${{ vars.KUMM_API_BASE || 'https://app.kumm.fr' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run typecheck
      - run: npm test
      - name: Projet Android
        env:
          GOOGLE_SERVICES_JSON: ${{ github.event_name == 'workflow_dispatch' && secrets.GOOGLE_SERVICES_JSON || '' }}
        run: |
          node -e 'const u = new URL(process.env.VITE_API_BASE); if (u.protocol !== "https:" || u.username || u.password || u.search || u.hash) throw Error("Adresse publique HTTPS requise")'
          if [ "$PROFILE" = sideload ]; then export VITE_SIDELOAD_UPDATES=1; fi
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            node scripts/firebase-android.mjs
            export VITE_PUSH=1
          fi
          node scripts/prepare-android.mjs "$PROFILE" "$VERSION_CODE"
          npm run build:android
      - name: APK de test et bundle Play
        working-directory: android
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../kumm-test.apk
          if [ "$PROFILE" = play ]; then
            ./gradlew bundleRelease
            cp app/build/outputs/bundle/release/app-release.aab ../kumm-play-unsigned.aab
          fi
      - name: Vérifier les fichiers générés
        run: |
          python3 scripts/check-android-package.py kumm-test.apk
          if [ "$PROFILE" = play ]; then
            python3 scripts/check-android-package.py kumm-play-unsigned.aab
            ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
            "$ANALYZER" manifest permissions kumm-test.apk > "${RUNNER_TEMP}/kumm-permissions"
            ! grep -q REQUEST_INSTALL_PACKAGES "${RUNNER_TEMP}/kumm-permissions"
            test "$( "$ANALYZER" manifest target-sdk kumm-test.apk)" -ge 36
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: kumm-android-review
          path: |
            kumm-test.apk
            kumm-play-unsigned.aab
          if-no-files-found: error
      - name: Signer l’APK sideload pour diffusion
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.profil == 'sideload' && inputs.publier
        working-directory: android
        env:
          KS_B64: ${{ secrets.KUMM_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KUMM_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_B64" && test -n "$KS_PASS"
          ./gradlew assembleRelease
          umask 077
          trap 'rm -f "$RUNNER_TEMP/kumm.jks"' EXIT
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kumm.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligne.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/kumm.jks" --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias kumm --out ../kumm.apk "$RUNNER_TEMP/aligne.apk"
          "$BT/apksigner" verify ../kumm.apk
          python3 ../scripts/check-android-package.py ../kumm.apk
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.profil == 'sideload' && inputs.publier
        with:
          name: kumm-apk-sideload-signe
          path: kumm.apk
          if-no-files-found: error

  publier:
    needs: apk
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.profil == 'sideload' && inputs.publier
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: kumm-apk-sideload-signe
          path: ${{ runner.temp }}/kumm-publication
      - name: Publier pour les mises à jour hors Play
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          V=$(node -p "require('./package.json').version")
          D="$RUNNER_TEMP/kumm-publication"
          APK="$D/kumm.apk"
          printf '{"version":"%s","code":%s,"size":%s,"sha256":"%s","date":"%s"}\n' "$V" "$VERSION_CODE" "$(stat -c%s "$APK")" "$(sha256sum "$APK" | cut -d' ' -f1)" "$(date -u +%FT%TZ)" > "$D/latest.json"
          git worktree add --detach "$RUNNER_TEMP/kumm-apk-tree" origin/apk || {
            git fetch origin apk
            git worktree add --detach "$RUNNER_TEMP/kumm-apk-tree" FETCH_HEAD
          }
          cp "$APK" "$D/latest.json" "$RUNNER_TEMP/kumm-apk-tree/"
          git -C "$RUNNER_TEMP/kumm-apk-tree" add kumm.apk latest.json
          git -C "$RUNNER_TEMP/kumm-apk-tree" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "APK $V (version $VERSION_CODE)"
          git -C "$RUNNER_TEMP/kumm-apk-tree" push origin HEAD:refs/heads/apk
