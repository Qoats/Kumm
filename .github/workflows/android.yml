# Builds de revue et de diffusion, sans envoi vers Google Play.
name: APK Android

on:
  pull_request:
  workflow_dispatch:
    inputs:
      profil:
        description: "Play (APK de test + AAB) ou sideload (APK autonome)"
        type: choice
        options: [play, sideload]
        default: play
      publier:
        description: "Préparer une GitHub Release en brouillon avec l’APK signé"
        type: boolean
        default: false
      nouvelle_signature:
        description: "Migration unique : accepter une clé de signature différente de l’APK distribué (les utilisateurs devront réinstaller)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run typecheck
      - run: npm test
      - run: bash tests/vps-apk.test.sh
      - name: Valider Compose et démarrer l’image de test
        run: |
          cp .env.production.example .env
          docker compose config --quiet
          docker build -t kumm-ci .
          container=$(docker run -d --network none kumm-ci)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for i in {1..15}; do
            if docker exec "$container" node -e 'Promise.all([fetch("http://127.0.0.1:3000/health"), fetch("http://127.0.0.1:3000/"), fetch("http://127.0.0.1:3000/api/kumm-mode").then(r => r.json())]).then(([health, web, mode]) => process.exit(health.ok && web.ok && mode.cts === "scheduled" && !mode.traffic ? 0 : 1)).catch(() => process.exit(1))'; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1

  apk:
    needs: verification
    runs-on: ubuntu-24.04
    env:
      PROFILE: ${{ inputs.profil || 'play' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Projet Android
        env:
          GOOGLE_SERVICES_JSON: ${{ github.event_name == 'workflow_dispatch' && secrets.GOOGLE_SERVICES_JSON || '' }}
        run: |
          if [ "$PROFILE" = sideload ]; then export VITE_SIDELOAD_UPDATES=1; else export VITE_PLAY_UPDATES=1; fi
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            node scripts/android/firebase-android.mjs
            export VITE_PUSH=1
          fi
          node scripts/android/prepare-android.mjs "$PROFILE" "$VERSION_CODE"
          npm run build:android
      - name: APK de test et bundle Play
        working-directory: android
        run: |
          ./gradlew testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../kumm-test.apk
          if [ "$PROFILE" = play ]; then
            ./gradlew bundleRelease
            cp app/build/outputs/bundle/release/app-release.aab ../kumm-play-unsigned.aab
          fi
      - name: Vérifier les fichiers générés
        run: |
          python3 scripts/android/check-android-package.py kumm-test.apk
          if [ "$PROFILE" = play ]; then
            python3 scripts/android/check-android-package.py kumm-play-unsigned.aab
            ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
            "$ANALYZER" manifest permissions kumm-test.apk > "${RUNNER_TEMP}/kumm-permissions"
            ! grep -q REQUEST_INSTALL_PACKAGES "${RUNNER_TEMP}/kumm-permissions"
            test "$( "$ANALYZER" manifest target-sdk kumm-test.apk)" -ge 36
            # la version Play ne déclare ni service de premier plan, ni notifications, ni widgets trafic / Vélhop
            ! grep -Eq 'FOREGROUND_SERVICE|POST_NOTIFICATIONS' "${RUNNER_TEMP}/kumm-permissions"
            "$ANALYZER" manifest print kumm-test.apk > "${RUNNER_TEMP}/kumm-manifest"
            ! grep -Eq 'TripService|TrafficWidget|BikeWidget|foregroundServiceType' "${RUNNER_TEMP}/kumm-manifest"
          fi
      - name: Signer le bundle Play avec la clé d’envoi
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.profil == 'play'
        env:
          KS_B64: ${{ secrets.KUMM_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KUMM_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_B64" && test -n "$KS_PASS"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/kumm.jks"' EXIT
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kumm.jks"
          cp kumm-play-unsigned.aab kumm-play.aab
          jarsigner -keystore "$RUNNER_TEMP/kumm.jks" -storetype PKCS12 -storepass:env KS_PASS -sigalg SHA256withRSA -digestalg SHA-256 kumm-play.aab kumm
          jarsigner -verify kumm-play.aab
          python3 scripts/android/check-android-package.py kumm-play.aab
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.profil == 'play'
        with:
          name: kumm-play-aab-signe
          path: kumm-play.aab
      - uses: actions/upload-artifact@v6
        with:
          name: kumm-android-review
          path: |
            kumm-test.apk
            kumm-play-unsigned.aab
          if-no-files-found: error
      - name: Signer l’APK sideload pour diffusion
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.profil == 'sideload' && inputs.publier
        working-directory: android
        env:
          KS_B64: ${{ secrets.KUMM_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KUMM_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KS_B64" && test -n "$KS_PASS"
          ./gradlew assembleRelease
          umask 077
          trap 'rm -f "$RUNNER_TEMP/kumm.jks"' EXIT
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kumm.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligne.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/kumm.jks" --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias kumm --out ../kumm.apk "$RUNNER_TEMP/aligne.apk"
          "$BT/apksigner" verify ../kumm.apk
          python3 ../scripts/android/check-android-package.py ../kumm.apk
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.profil == 'sideload' && inputs.publier
        with:
          name: kumm-apk-sideload-signe
          path: kumm.apk
          if-no-files-found: error

  publier:
    needs: apk
    concurrency: kumm-publication-apk
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.profil == 'sideload' && inputs.publier
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: kumm-apk-sideload-signe
          path: ${{ runner.temp }}/kumm-publication
      - name: Préparer la release GitHub (brouillon uniquement)
        env:
          VERSION_CODE: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          KUMM_ALLOW_CERT_CHANGE: ${{ inputs.nouvelle_signature && '1' || '0' }}
        run: |
          D="$RUNNER_TEMP/kumm-publication"
          APK="$D/kumm.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName > "$D/stable-list.json"
          if node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).length ? 0 : 1)' "$D/stable-list.json"; then
            gh release view --json tagName > "$D/stable.json"
            tag=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).tagName' "$D/stable.json")
            P="$D/stable"
            mkdir "$P"
            gh release download "$tag" --pattern kumm.apk --pattern latest.json --dir "$P"
          else
            # Première migration seulement : référence de signature/version historique.
            git fetch --quiet origin refs/heads/apk
            previous=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
            P="$RUNNER_TEMP/kumm-apk-tree"
            git worktree add --detach "$P" "$previous"
          fi
          # Les deux APK doivent être valides ; leurs certificats sont lus directement dans l'archive
          # (le texte d'apksigner change d'une version à l'autre et n'est pas fiable à analyser).
          "$BT/apksigner" verify "$P/kumm.apk"
          "$BT/apksigner" verify "$APK"
          python3 scripts/android/apk-cert.py "$P/kumm.apk" > "$D/previous.cert"
          python3 scripts/android/apk-cert.py "$APK" > "$D/candidate.cert"
          "$BT/aapt" dump badging "$APK" > "$D/candidate.badging"
          node scripts/android/release.mjs "$APK" "$VERSION_CODE" "$P/latest.json" "$D/candidate.badging" "$D/previous.cert" "$D/candidate.cert" "$D/latest.json"
          # La branche apk reste une référence de migration, jamais modifiée ni supprimée.
          version=$(node -p 'require("./package.json").version')
          tag="android-${version}-${VERSION_CODE}"
          gh release create "$tag" "$APK" "$D/latest.json" --target "$GITHUB_SHA" --draft --title "Kumm Android $version" --notes-file docs/ANDROID-RELEASE-NOTES.md
