<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#136A45">
<meta name="application-name" content="Kumm">
<meta name="apple-mobile-web-app-title" content="Kumm">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Kumm – Transports de Strasbourg</title>
<!-- applique le thème choisi avant le premier affichage (évite un éclair de la mauvaise couleur) -->
<script src="/theme-init.js"></script>
</head>
<body>
<!-- animation de lancement : dessinée dès la première image (avant le chargement de l'application), puis retirée par
     web/src/splash.ts ; même fond vert que l'écran de démarrage Android, pour un enchaînement sans éclair -->
<div id="splash" aria-hidden="true">
  <style>
    #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:radial-gradient(120% 80% at 50% 40%,#1B7F55 0%,#136342 55%,#0A4630 100%);transition:opacity .45s ease,transform .45s ease;
      animation:spSafety .4s ease 5s forwards}
    #splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
    #splash svg{width:132px;height:132px;overflow:visible;filter:drop-shadow(0 18px 30px rgba(0,0,0,.28))}
    .sp-tile{transform-box:fill-box;transform-origin:center;animation:spTile .5s cubic-bezier(.2,1.4,.4,1) both}
    .sp-l{stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw .38s ease-out forwards}
    .sp-l1{animation-delay:.25s}.sp-l2{animation-delay:.5s}.sp-l3{animation-delay:.68s}
    .sp-d{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:spPop .32s cubic-bezier(.2,1.6,.4,1) forwards}
    .sp-d1{animation-delay:.3s}.sp-d2{animation-delay:.58s}.sp-d3{animation-delay:.82s}.sp-d4{animation-delay:.98s}
    .sp-name{font:800 34px/1 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.5px;color:#fff;
      opacity:0;transform:translateY(10px);animation:spUp .45s ease-out .9s forwards}
    .sp-lines{display:flex;gap:6px;height:6px}
    .sp-lines i{width:22px;border-radius:3px;background:var(--c);transform:scaleX(0);transform-origin:left;animation:spBar .3s ease-out forwards}
    @keyframes spTile{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes spDraw{to{stroke-dashoffset:0}}
    @keyframes spPop{to{transform:scale(1)}}
    @keyframes spUp{to{opacity:1;transform:none}}
    @keyframes spBar{to{transform:scaleX(1)}}
    @keyframes spSafety{to{opacity:0;visibility:hidden}}   /* application qui ne démarre pas : l'animation ne reste pas affichée */
    @media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
  </style>
  <svg viewBox="0 0 512 512">
    <defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22966A"/><stop offset="1" stop-color="#0A4630"/></linearGradient></defs>
    <rect class="sp-tile" width="512" height="512" rx="116" fill="url(#spg)"/>
    <g fill="none" stroke-width="44" stroke-linecap="round">
      <path class="sp-l sp-l1" d="M168 132V380" stroke="#fff" pathLength="1"/>
      <path class="sp-l sp-l2" d="M168 256L352 132" stroke="#FFC93C" pathLength="1"/>
      <path class="sp-l sp-l3" d="M168 256L352 380" stroke="#4CC3FF" pathLength="1"/>
    </g>
    <g class="sp-d sp-d1"><circle cx="168" cy="132" r="33" fill="#fff"/><circle cx="168" cy="132" r="13" fill="#136A45"/></g>
    <g class="sp-d sp-d2"><circle cx="168" cy="380" r="33" fill="#fff"/><circle cx="168" cy="380" r="13" fill="#136A45"/></g>
    <g class="sp-d sp-d3"><circle cx="352" cy="132" r="33" fill="#fff"/><circle cx="352" cy="132" r="13" fill="#136A45"/></g>
    <g class="sp-d sp-d4"><circle cx="352" cy="380" r="33" fill="#fff"/><circle cx="352" cy="380" r="13" fill="#136A45"/></g>
  </svg>
  <div class="sp-name">Kumm</div>
  <div class="sp-lines"><i style="--c:#E10D19;animation-delay:1.05s"></i><i style="--c:#009EE0;animation-delay:1.1s"></i><i style="--c:#F29400;animation-delay:1.15s"></i><i style="--c:#009933;animation-delay:1.2s"></i><i style="--c:#9085BA;animation-delay:1.25s"></i><i style="--c:#97BF0D;animation-delay:1.3s"></i></div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
